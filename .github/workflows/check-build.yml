# Node/static-site template workflow.
# Suitable for Vite/Svelte/React/browser-game projects.
# Adapt or replace for Python, R, MATLAB, PsychoPy, FastAPI-only, or other project types.
#
# This is the automated safety net for the commit-to-`main` workflow: it runs on
# every push (and PRs to main), so broken builds or leaked secrets are caught
# mechanically even if local pre-commit hooks were never installed.
name: Check build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify (project's verify command, if defined)
        run: npm run check --if-present

      - name: Run public-build safety check
        run: bash scripts/check-public-build.sh dist

      - name: Validate prompt numbering
        run: bash scripts/validate-prompts.sh

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: validate structured content against the spec's schema.
      # If the project defines data schemas (see primary_authoritative/specification.md)
      # and ships structured content, add a validation step here, e.g.:
      #   - run: node scripts/validate-content.mjs
      #
      # Optional: smoke test that the built site loads without console errors,
      # e.g. a Playwright check against the `dist/` preview.

  # End-to-end tests of the production build in Chromium (desktop and phone
  # profiles) and Firefox: five rounds, replay, keyboard play, timeouts,
  # accessibility, and the version 1 guarantees (no camera, no storage, no
  # outgoing data).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          E2E_FIREFOX: '1'

  # The optional eye-tracking preview (version 2), built with VITE_EYE_TRACKING=1.
  # Chromium's fake camera has no face in it, and the synthetic tracker reports
  # the pointer as gaze: these tests check the code paths (consent, fallbacks,
  # calibration flow, recording, camera release), not measurement quality.
  e2e-eyetracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check the eye-tracking build
        run: |
          VITE_EYE_TRACKING=1 npx vite build --outDir dist-eyetracking
          EYE_TRACKING_BUILD=1 bash scripts/check-public-build.sh dist-eyetracking

      - name: Run eye-tracking end-to-end tests
        run: npm run test:e2e:eyetracking
